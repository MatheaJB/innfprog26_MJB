<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cheat Sheet for Betinget Logikk</title>
</head>
<body>
<p id="loginStatus">Ikke logget inn</p>

    <script>
        const username = "mathea"
        const password = "passord123"
        let loggedIn = false

        //IF-test som sjekker om innsendt brukernavn matcher systemet:
        if(username === "mathea") {
            console.log("Brukernavn er riktig")
        } else {
            console.log("Brukernavn er feil")
        }

        //IF-test som sjekker om brukernavn og passord er riktig, og gjør klar login:
        if(username === "mathea" && password === "passord123") {
            loggedIn = true
            console.log(loggedIn)
        }

        //Sjekk om en bruker er logget inn, og oppdater grensesnitt hvis den er det:
        if(loggedIn) {
            document.getElementById("loginStatus").innerHTML = "Hei, Mathea"        
        }
    </script>
</body>
</html>
